# docker-compose.yml
# Levanta SQL Server 2025 (Developer Edition) y despliega el esquema de
# BARRIO automaticamente. Pensado para correr tanto en local como dentro de
# un Docker Sandbox (microVM con motor Docker completo).
#
# IMPORTANTE: la contrasena de SA se lee de la variable de entorno
# MSSQL_SA_PASSWORD (definida en un archivo .env NO versionado). Nunca la
# escribas aqui ni la subas a git.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: barrio-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - barrio_sql_data:/var/opt/mssql
    healthcheck:
      # Verificacion por TCP (no depende de que sqlcmd este instalado dentro
      # de la imagen de SQL Server/Azure SQL Edge, que varia entre ellas).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  deploy-schema:
    image: mcr.microsoft.com/mssql-tools
    container_name: barrio-deploy-schema
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      BARRIO_API_DB_PASSWORD: ${BARRIO_API_DB_PASSWORD}
    entrypoint: ["/bin/bash", "/scripts-entry/deploy.sh"]
    volumes:
      - ../sql:/scripts:ro
      - ./deploy.sh:/scripts-entry/deploy.sh:ro
      - ./create_api_user.sql:/scripts-entry/create_api_user.sql:ro

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: barrio-api
    restart: unless-stopped
    depends_on:
      deploy-schema:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET}
      BARRIO_DB_SERVER: sqlserver
      BARRIO_DB_NAME: BarrioDB
      BARRIO_DB_AUTH_MODE: sql-password
      BARRIO_DB_TRUST_SERVER_CERTIFICATE: "true"
      BARRIO_ALLOW_SQL_PASSWORD_AUTH: "true"
      BARRIO_DB_USER: barrio_app_api
      BARRIO_DB_PASSWORD: ${BARRIO_API_DB_PASSWORD}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-simulated}
      PEY_LIVE_CHARGES_ENABLED: ${PEY_LIVE_CHARGES_ENABLED:-false}
      PEY_API_KEY: ${PEY_API_KEY:-}
      PEY_WEBHOOK_SECRET: ${PEY_WEBHOOK_SECRET:-}
      PEY_WEBHOOK_TOLERANCE_SECONDS: ${PEY_WEBHOOK_TOLERANCE_SECONDS:-300}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  barrio_sql_data:
