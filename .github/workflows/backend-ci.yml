name: Backend checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check apps/api/src/server.mjs
          node --check apps/api/src/pey.mjs
          node --check apps/api/public/app.js
      - name: Run simulated tests
        working-directory: apps/api
        run: node --test
      - name: Validate Compose configuration
        run: docker compose --env-file database/docker/.env.example -f database/docker/docker-compose.yml config --quiet
